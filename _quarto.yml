# --- Project Configuration ---
# output-dir here is only a local fallback used if QUARTO_PROFILE isn't
# set/active (see _quarto-laptop.yml / _quarto-desktop.yml, selected via
# the QUARTO_PROFILE env var in .Renviron) -- normally renders go straight
# to this machine's OneDrive folder instead.
project:
  type: default
  output-dir: _render_fallback

# --- Execution Settings ---
execute:
  freeze: auto
  message: true
  warning: true
  
# --- Bibliography & Citations ---
bibliography: references.bib
csl: journal-of-clinical-oncology.csl

# --- Format Configuration ---
format:
  # --- HTML Settings ---
  html:
    # --- Document Settings ---
    theme: cosmo
    code-fold: true
    toc: true
    toc-location: right
    embed-resources: true
    css: style.css

# --- Document Language
lang: en